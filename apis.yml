  name: Vim Canvas SDK (VimOS.js)
  description: >-
    The Vim Canvas developer platform and VimOS.js JavaScript SDK for embedding
    applications at the point of care. Reads EHR state (Patient, Encounter, Orders,
    Referral, Claim, plus problem/medication/allergy/lab/vitals lists) and writes back to
    Encounter, Referral, and Order resources through Vim Connect's EHR connectivity layer.
    Proprietary SDK surface - not FHIR.
