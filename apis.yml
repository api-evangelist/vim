aid: vim
url: https://raw.githubusercontent.com/api-evangelist/vim/refs/heads/main/apis.yml
name: Vim
kind: company
description: >-
  Vim is a United States healthcare technology company (getvim.com) that operates a
  clinical workflow and point-of-care integration platform connecting health plans,
  provider organizations, and digital-health applications to physicians inside their
  existing electronic health records. Through the Vim Canvas developer platform and the
  VimOS.js JavaScript SDK, applications embed actionable clinical insights - diagnosis
  gaps, risk, quality, and social determinants of health - directly into supported
  ambulatory EHR workflows and can read and write EHR resources (Patient, Encounter,
  Orders, Referral, Claim) at the point of care. Vim also exposes a REST API at
  api.getvim.com/v1 for provisioning applications, organizations, invitations,
  appointment lookups, and chart retrieval, authenticated with OAuth 2.0 client
  credentials via an Auth0-backed authorization server (auth.getvim.com). Vim is HIPAA,
  SOC 2, and HITRUST certified. The platform is proprietary REST and SDK based; it is not
  an HL7 FHIR API and publishes no FHIR CapabilityStatement. The API is available only to
  application servers hosted within the United States.
