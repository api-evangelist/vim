    url: https://connect.getvim.com/vim-os-sdk/v2.x.x/vim-sdk.js
    install: '<script src="https://connect.getvim.com/vim-os-sdk/v2.x.x/vim-sdk.js"></script>'
    official: true
    http_status: 200
    description: >-
      Vim-hosted CDN build of the VimOS.js SDK. Vim documents this as the
      preferred integration and explicitly instructs developers NOT to bundle or
      self-host it. Format changed from UMD (vim-sdk.umd.js) to IIFE
      (vim-sdk.js) in 2.0.16.
    note: >-
      version: null because the distribution URL is UNPINNED - the path segment
      is the literal major track /v2.x.x/, not a resolved version, so the build
      served floats to the latest 2.x. There is no CDN metadata endpoint (this
      is Vim's own origin, not npm/unpkg/jsDelivr) and the response carries no
      version marker a consumer can read. A script-tag integrator cannot
      determine which SDK build they are executing; only npm consumers can.
notes: >-
  No Python, Java, .NET, Go, Ruby, PHP or Rust client exists - searched npm
  (vim-os*, getvim*), and the getvim GitHub org, which hosts only demo/starter
  applications that CONSUME the SDK (vim-canvas-demo-app,
  vim-base-app-template, vim-canvas-demo-angular, vim-ai-scribe-demo-app), not
  additional published libraries. The Vim REST API (api.getvim.com/v1) has no
  SDK of any kind; it is called over plain HTTP, with a first-party Postman
  collection published for the Invitations flow.
